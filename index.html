<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HAPPYCLEAN 작업관리</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}
header{background:#111;color:#fff;padding:16px;position:sticky;top:0;z-index:10}
.wrap{max-width:900px;margin:auto;padding:14px}
.card{background:#fff;border-radius:15px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #0000000d}
h1,h2,h3{margin:4px 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
input,select,textarea,button{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid #ddd;margin:5px 0}
textarea{min-height:80px;resize:vertical}
button{background:#111;color:#fff;border:0;font-weight:700;cursor:pointer;transition:.12s}
button:active{transform:scale(.97)}
button:disabled{opacity:.55;cursor:wait}
button.secondary{background:#eef0f2;color:#111}
button.danger{background:#b42318;color:#fff}
.muted{font-size:13px;color:#666}
.hidden{display:none!important}
.notice{background:#f0f5ff;border-radius:10px;padding:10px;font-size:13px}
.dangerText{color:#b42318}
.ok{color:#067647}
.photos{display:flex;gap:8px;overflow:auto;margin:6px 0 12px}
.photos img{width:90px;height:90px;object-fit:cover;border-radius:9px}
.job{border:1px solid #eee;border-radius:11px;padding:12px;margin:8px 0}
.topline{display:flex;justify-content:space-between;align-items:center;gap:8px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.actions button{width:auto;margin:5px 0}
.resultHero{background:#111;color:#fff;border-radius:16px;padding:20px;margin:12px 0}
.resultSection{background:#fff;border-radius:15px;padding:16px;margin:12px 0}
.resultPhoto{width:100%;max-width:700px;border-radius:12px;display:block;margin:8px 0}
.linkBox{background:#f7f7f7;border-radius:10px;padding:10px;word-break:break-all;font-size:12px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.topline{align-items:flex-start}.actions button{flex:1}}
</style>
</head>
<body>
<header><div class="wrap"><b>HAPPYCLEAN · 온라인 작업관리</b></div></header>
<div class="wrap">

<section id="publicPage" class="hidden">
  <div id="publicResult"></div>
</section>

<section id="loginCard" class="card">
  <h2>직원 로그인</h2>
  <p id="accessStatus" class="muted"></p>
  <p class="muted">해피크린 작업관리 계정으로 로그인하세요.</p>
  <input id="email" type="email" placeholder="이메일">
  <input id="password" type="password" placeholder="비밀번호">
  <button id="loginBtn" onclick="login()">로그인</button>
  <div id="loginMsg" class="muted"></div>
</section>

<main id="app" class="hidden">
  <div class="card">
    <div class="topline">
      <h2>작업 등록</h2>
      <button style="width:auto;padding:8px 12px" onclick="logout()">로그아웃</button>
    </div>

    <div class="grid">
      <div><label>작업일</label><input id="date" type="date"></div>
      <div><label>고객명</label><input id="name"></div>
    </div>
    <div class="grid">
      <input id="phone" placeholder="연락처">
      <input id="address" placeholder="주소">
    </div>
    <textarea id="note" placeholder="특이사항"></textarea>
    <div class="grid">
      <input id="type" placeholder="에어컨 종류">
      <input id="qty" type="number" value="1" min="1" placeholder="수량">
    </div>
    <div class="grid">
      <input id="maker" placeholder="제조사">
      <input id="model" placeholder="모델명">
    </div>
    <div class="grid">
      <input id="price" type="number" value="0" placeholder="작업금액">
      <select id="payment">
        <option>미결제</option><option>현금</option><option>카드</option><option>계좌이체</option>
      </select>
    </div>

    <div id="hospitalNotice" class="notice hidden">
      10월 1일 작업은 <b>성빈센트병원</b>으로 자동 입력됩니다.
      고객명·연락처·주소 없이도 저장할 수 있습니다.
    </div>

    <label>작업 전 사진</label>
    <div class="muted">사진은 0장도 가능하며, 추가 선택하면 기존 선택에 계속 추가됩니다.</div>
    <button type="button" class="secondary" onclick="openPhotoPicker('before')">사진 첨부</button><input id="beforePicker" type="file" accept="image/*" multiple hidden>
    <div id="beforePrev" class="photos"></div>

    <label>작업 후 사진</label>
    <div class="muted">사진은 0장도 가능하며, 추가 선택하면 기존 선택에 계속 추가됩니다.</div>
    <button type="button" class="secondary" onclick="openPhotoPicker('after')">사진 첨부</button><input id="afterPicker" type="file" accept="image/*" multiple hidden>
    <div id="afterPrev" class="photos"></div>

    <button id="saveBtn" onclick="saveJob()">작업 저장</button>
    <div id="saveMsg" class="muted"></div>
  </div>

  <div class="card">
    <h2>작업 이력</h2>
    <input id="search" placeholder="고객명 / 연락처 / 주소 검색" oninput="loadJobs()">
    <div id="jobs"></div>
  </div>
</main>
</div>

<script>
const SUPABASE_URL="https://lltfyjixbdnulfkrzanu.supabase.co";
const SUPABASE_KEY="sb_publishable_8mfh36Ulp8kCQtdM7fLfUA_IpszyJXD";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const BUCKET="happyclean-photos";
const ADMIN_EMAIL="ghd1930@gmail.com";
const $=id=>document.getElementById(id);
window.tempLogin=false;
let beforeFiles=[],afterFiles=[];

function localDate(){
  const d=new Date(),off=d.getTimezoneOffset();
  return new Date(d.getTime()-off*60000).toISOString().slice(0,10);
}
function requiresLogin(){return localDate()>="2026-10-03";}
function esc(s){
  return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function fileKey(f){return `${f.name}|${f.size}|${f.lastModified}`;}

function applyDateRule(){
  if($("date").value==="2026-10-01"){
    $("name").value="성빈센트병원";
    $("hospitalNotice").classList.remove("hidden");
  }else $("hospitalNotice").classList.add("hidden");
}

function addFiles(input,type,box){
  const target=type==="before"?beforeFiles:afterFiles;
  for(const f of [...input.files]){
    if(!target.some(x=>fileKey(x)===fileKey(f)))target.push(f);
  }
  input.value="";
  renderPhotos(type,box);
}
function renderPhotos(type,box){
  const target=type==="before"?beforeFiles:afterFiles;
  box.innerHTML="";
  target.forEach((f,i)=>{
    const wrap=document.createElement("div");
    wrap.style.cssText="position:relative;flex:0 0 auto";
    const img=document.createElement("img");
    img.src=URL.createObjectURL(f);
    const del=document.createElement("button");
    del.textContent="×";
    del.style.cssText="position:absolute;right:2px;top:2px;width:28px;height:28px;padding:0;margin:0;border-radius:50%;background:#111;color:#fff";
    del.onclick=()=>{target.splice(i,1);renderPhotos(type,box)};
    wrap.append(img,del);box.appendChild(wrap);
  });
}

$("date").value=localDate();
$("date").onchange=applyDateRule;
function openPhotoPicker(type){
  // capture 속성을 사용하지 않아 휴대폰의 기본 사진 선택창에서
  // "카메라로 촬영" 또는 "사진 보관함/갤러리"를 바로 선택할 수 있게 합니다.
  $(type+"Picker").click();
}
$("beforePicker").onchange=()=>addFiles($("beforePicker"),"before",$("beforePrev"));
$("afterPicker").onchange=()=>addFiles($("afterPicker"),"after",$("afterPrev"));
applyDateRule();

async function login(){
  $("loginMsg").textContent="";
  if(!requiresLogin()){
    window.tempLogin=true;showState(null);
    $("loginMsg").textContent="로그인되었습니다.";
    return;
  }
  const email=$("email").value.trim(),password=$("password").value;
  if(!email||!password){$("loginMsg").textContent="이메일과 비밀번호를 입력하세요.";return}
  $("loginBtn").disabled=true;$("loginBtn").textContent="로그인 중...";
  const {error}=await sb.auth.signInWithPassword({email,password});
  $("loginBtn").disabled=false;$("loginBtn").textContent="로그인";
  if(error){$("loginMsg").textContent=error.message;return}
  $("loginMsg").textContent="로그인되었습니다.";
}
async function logout(){
  window.tempLogin=false;
  await sb.auth.signOut();
  showState(null);
}

function showState(session){
  const active=!!session||window.tempLogin===true;
  $("loginCard").classList.toggle("hidden",active);
  $("app").classList.toggle("hidden",!active);
  $("publicPage").classList.add("hidden");
  $("accessStatus").textContent=requiresLogin()
    ?"현재는 이메일과 비밀번호를 입력한 계정 로그인만 사용할 수 있습니다."
    :"10월 1일까지는 로그인 버튼만 눌러도 작업등록 화면으로 들어갈 수 있습니다.";
  if(session)loadJobs();
}

function compress(file){
  if(!file.type.startsWith("image/"))return Promise.resolve(file);
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      const max=1600,ratio=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=Math.round(img.width*ratio);c.height=Math.round(img.height*ratio);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>resolve(new File([b],file.name.replace(/\.[^.]+$/,"")+".jpg",{type:"image/jpeg"})),"image/jpeg",.78);
    };
    img.onerror=reject;img.src=URL.createObjectURL(file);
  });
}

async function saveJob(){
  const {data:{session}}=await sb.auth.getSession();
  if(requiresLogin()&&!session){alert("2026년 10월 2일부터는 실제 계정으로 로그인 후 등록할 수 있습니다.");return}
  if(!requiresLogin()&&!session&&!window.tempLogin){alert("로그인 버튼을 먼저 눌러주세요.");return}

  const btn=$("saveBtn");btn.disabled=true;btn.textContent="저장 중...";
  $("saveMsg").textContent="";
  const workDate=$("date").value;
  const customerName=workDate==="2026-10-01"?"성빈센트병원":$("name").value.trim();
  const jobId=crypto.randomUUID();
  const publicToken=crypto.randomUUID();

  const {error:jobError}=await sb.from("jobs").insert({
    id:jobId,public_token:publicToken,work_date:workDate,
    customer_name:customerName,phone:$("phone").value.trim(),
    address:$("address").value.trim(),note:$("note").value.trim(),
    ac_type:$("type").value.trim(),qty:Number($("qty").value)||1,
    maker:$("maker").value.trim(),model:$("model").value.trim(),
    price:Number($("price").value)||0,payment:$("payment").value
  });
  if(jobError){
    $("saveMsg").textContent=jobError.message;btn.disabled=false;btn.textContent="작업 저장";return;
  }

  const all=[["before",beforeFiles],["after",afterFiles]];
  const photoRows=[];
  try{
    for(const [type,files] of all){
      for(let i=0;i<files.length;i++){
        const f=await compress(files[i]);
        const path=`${jobId}/${type}/${Date.now()}_${i}_${crypto.randomUUID()}.jpg`;
        const {error}=await sb.storage.from(BUCKET).upload(path,f,{contentType:"image/jpeg",upsert:false});
        if(error)throw new Error("사진 업로드 실패: "+error.message);
        photoRows.push({job_id:jobId,photo_type:type,storage_path:path,original_name:files[i].name,sort_order:i});
      }
    }
    if(photoRows.length){
      const {error}=await sb.from("job_photos").insert(photoRows);
      if(error)throw new Error("사진 정보 저장 실패: "+error.message);
    }
  }catch(e){
    $("saveMsg").textContent=e.message;
    btn.disabled=false;btn.textContent="작업 저장";return;
  }

  const link=`${location.origin}${location.pathname}?token=${encodeURIComponent(publicToken)}`;
  $("saveMsg").innerHTML=`<span class="ok">저장 완료</span>`;
  $("saveMsg").innerHTML+=`<div class="linkBox" style="margin-top:8px">${esc(link)}</div>`;
  $("saveMsg").innerHTML+=`<button class="secondary" style="margin-top:8px" onclick="copyText(${JSON.stringify(link)})">고객 링크 복사</button>`;
  beforeFiles=[];afterFiles=[];$("beforePrev").innerHTML="";$("afterPrev").innerHTML="";
  $("beforePicker").value="";$("afterPicker").value="";
  btn.disabled=false;btn.textContent="작업 저장";
  await loadJobs();
}

async function copyText(text){
  try{await navigator.clipboard.writeText(text);alert("고객 링크가 복사되었습니다.");}
  catch(e){prompt("아래 링크를 복사하세요.",text);}
}

async function loadJobs(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){
    $("jobs").innerHTML="<p class='muted'>10월 1일까지는 등록만 가능합니다. 작업 이력은 로그인 후 확인할 수 있습니다.</p>";
    return;
  }
  const q=($("search").value||"").trim();
  let query=sb.from("jobs").select("*,job_photos(id,photo_type)").order("work_date",{ascending:false}).order("created_at",{ascending:false}).limit(100);
  if(q)query=query.or(`customer_name.ilike.%${q}%,phone.ilike.%${q}%,address.ilike.%${q}%`);
  const {data,error}=await query;
  if(error){$("jobs").innerHTML=`<p class="dangerText">${esc(error.message)}</p>`;return}
  const email=session.user?.email||"";
  const isAdmin=email.toLowerCase()===ADMIN_EMAIL.toLowerCase();

  $("jobs").innerHTML=(data||[]).map(j=>{
    const link=`${location.origin}${location.pathname}?token=${encodeURIComponent(j.public_token)}`;
    const photos=j.job_photos||[];
    const beforeCount=photos.filter(p=>p.photo_type==="before").length;
    const afterCount=photos.filter(p=>p.photo_type==="after").length;
    const extraCount=photos.filter(p=>p.photo_type==="extra").length;
    return `<div class="job">
      <b>${esc(j.work_date)} · ${esc(j.customer_name||"고객정보 없음")}</b><br>
      ${esc(j.ac_type||"")} ${j.qty||1}대 · ${Number(j.price||0).toLocaleString()}원<br>
      <span class="muted">${esc(j.address||"")}</span><br>
      <span class="muted">사진: 작업 전 ${beforeCount}장 · 작업 후 ${afterCount}장${extraCount?` · 추가 ${extraCount}장`:""}</span>
      <div class="actions">
        <button class="secondary" onclick="viewJob('${j.id}')">입력 내용·사진 보기</button>
        <button class="secondary" onclick='copyText(${JSON.stringify(link)})'>고객 링크 복사</button>
        ${isAdmin?`<button class="danger" onclick="deleteJob('${j.id}',this)">삭제</button>`:""}
      </div>
    </div>`;
  }).join("")||"<p class='muted'>등록된 작업이 없습니다.</p>";
}
async function viewJob(id){
  const {data:j,error}=await sb.from("jobs").select("*").eq("id",id).single();
  if(error){alert(error.message);return}
  const {data:p}=await sb.from("job_photos").select("*").eq("job_id",id).order("photo_type").order("sort_order");
  let html=`<h3>${esc(j.work_date)} · ${esc(j.customer_name||"")}</h3>
  <p>${esc(j.ac_type||"")} ${j.qty||1}대 / ${Number(j.price||0).toLocaleString()}원</p>
  <p>${esc(j.maker||"")} ${esc(j.model||"")}</p>
  <p>${esc(j.note||"")}</p>`;
  for(const type of ["before","after","extra"]){
    const arr=(p||[]).filter(x=>x.photo_type===type);if(!arr.length)continue;
    html+=`<b>${type==="before"?"작업 전":type==="after"?"작업 후":"추가"} 사진</b><div class="photos">`;
    for(const x of arr){
      const {data:u}=await sb.storage.from(BUCKET).createSignedUrl(x.storage_path,3600);
      if(u?.signedUrl)html+=`<img src="${u.signedUrl}">`;
    }
    html+="</div>";
  }
  const win=window.open("","_blank");
  if(!win){alert("팝업이 차단되었습니다. 팝업 허용 후 다시 시도하세요.");return}
  win.document.write(`<meta name="viewport" content="width=device-width,initial-scale=1"><body style="font-family:sans-serif;padding:20px;background:#f5f6f8">${html}</body>`);
  win.document.close();
}

async function deleteJob(id,button){
  const {data:{session}}=await sb.auth.getSession();
  if(!session||session.user?.email?.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){
    alert("관리자 계정만 삭제할 수 있습니다.");return;
  }
  if(!confirm("이 작업과 등록된 사진을 모두 삭제할까요?"))return;
  button.disabled=true;button.textContent="삭제 중...";
  const {data:photos,error:photoReadError}=await sb.from("job_photos").select("storage_path").eq("job_id",id);
  if(photoReadError){alert(photoReadError.message);button.disabled=false;button.textContent="삭제";return}
  if(photos?.length){
    const {error:e}=await sb.storage.from(BUCKET).remove(photos.map(x=>x.storage_path));
    if(e){alert("사진 삭제 실패: "+e.message);button.disabled=false;button.textContent="삭제";return}
  }
  const {error:jpError}=await sb.from("job_photos").delete().eq("job_id",id);
  if(jpError){alert("사진 정보 삭제 실패: "+jpError.message);button.disabled=false;button.textContent="삭제";return}
  const {error:jError}=await sb.from("jobs").delete().eq("id",id);
  if(jError){alert("작업 삭제 실패: "+jError.message);button.disabled=false;button.textContent="삭제";return}
  loadJobs();
}

async function renderPublicPage(token){
  $("loginCard").classList.add("hidden");
  $("app").classList.add("hidden");
  $("publicPage").classList.remove("hidden");
  $("publicResult").innerHTML=`<div class="card"><p>작업 결과를 불러오는 중...</p></div>`;

  const {data,error}=await sb.rpc("get_public_job",{p_token:token});
  if(error||!data?.job){
    $("publicResult").innerHTML=`<div class="card"><h2>작업 결과를 찾을 수 없습니다.</h2><p class="muted">링크가 잘못되었거나 만료된 링크일 수 있습니다.</p></div>`;
    return;
  }

  const j=data.job,photos=data.photos||[];
  let html=`<div class="resultHero"><h2>HAPPYCLEAN 작업 결과</h2><div>${esc(j.work_date||"")} · ${esc(j.customer_name||"")}</div></div>`;
  html+=`<div class="resultSection"><h3>작업 정보</h3>
    <p><b>에어컨</b> ${esc(j.ac_type||"")} ${j.qty||1}대</p>
    <p><b>제조사</b> ${esc(j.maker||"")} ${esc(j.model||"")}</p>
    <p><b>작업금액</b> ${Number(j.price||0).toLocaleString()}원</p>
    <p><b>결제</b> ${esc(j.payment||"")}</p>
    ${j.note?`<p><b>특이사항</b><br>${esc(j.note)}</p>`:""}
  </div>`;

  for(const type of ["before","after","extra"]){
    const arr=photos.filter(x=>x.photo_type===type).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
    if(!arr.length)continue;
    html+=`<div class="resultSection"><h3>${type==="before"?"작업 전":type==="after"?"작업 후":"추가"} 사진</h3>`;
    for(const x of arr){
      const url=`${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${x.storage_path}`;
      html+=`<img class="resultPhoto" src="${url}" loading="lazy">`;
    }
    html+=`</div>`;
  }
  html+=`<div class="resultSection"><div class="muted">HAPPYCLEAN · 에어컨 청소 전문</div></div>`;
  $("publicResult").innerHTML=html;
}

async function init(){
  const params=new URLSearchParams(location.search);
  const token=params.get("token");
  if(token){await renderPublicPage(token);return}
  const {data:{session}}=await sb.auth.getSession();
  showState(session);
  sb.auth.onAuthStateChange((_e,s)=>showState(s));
}
init();
</script>
</body>
</html>
